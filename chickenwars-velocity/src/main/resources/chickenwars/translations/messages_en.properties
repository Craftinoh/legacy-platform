rejoin.usage=&cUsage: &f/cw rejoin
rejoin.searching=&7Looking for your ChickenWars match...
rejoin.already-in-progress=&eA rejoin request is already running.
rejoin.no-session=&cYou have no ChickenWars match to return to.
rejoin.expired=&cYour rejoin window has expired.
rejoin.match-ended=&cThat match has already ended.
rejoin.eliminated=&cYou can no longer return to that match.
rejoin.instance-offline=&cThat match server is offline.
rejoin.instance-unavailable=&cThat match cannot accept you right now.
rejoin.reservation-failed=&cCould not reserve your seat. Try again.
rejoin.transfer-started=&aWelcome back to &f{arena}&a.
rejoin.transfer-failed=&cTransfer failed. Try again in a moment.
rejoin.backend-rejected=&c{server} &crefused your return to &f{arena}&c: &7{reason}
rejoin.no-permission=&cYou do not have permission to use this command.
rejoin.player-only=&cOnly players can use this command.
rejoin.reason.no-reservation=your seat was no longer reserved
rejoin.reason.reservation-claimed=your seat had already been used
rejoin.reason.wrong-match=that match no longer exists
rejoin.reason.reconnect-refused=you can no longer rejoin that match
rejoin.reason.profile-unavailable=your profile could not be loaded
rejoin.reason.timeout=the match server did not answer in time
rejoin.reason.unknown=the match server refused the request
