# Shop di ChickenWars.
#
# Struttura:
#   categories  riga superiore del menu (slot 0-8)
#   items       definizione strutturale degli articoli, senza prezzi
#   pricing     listini per profilo economico
#
# Profili economici:
#   solo_duel   usato da DUEL e SOLO
#   doubles     usato da DOUBLES
#   trio        usato da TRIO
#
# Campi articolo:
#   category    ID di una categoria dichiarata sopra
#   material    materiale Bukkit 1.8.8
#   data        data value (colori lana, vetro, ecc.)
#   amount      quantita' consegnata
#   team-color  true = colorato con il colore della squadra
#   repeatable  true = acquistabile piu' volte
#   slot        posizione nel menu (da 18 in poi); -1 = automatica
#   tier        CONSUMABLE, ARMOR, SWORD, PICKAXE, AXE, SHEARS
#   level       livello richiesto dal tier (obbligatorio salvo SHEARS)
#   permission  permesso richiesto, facoltativo
#
# Nomi e descrizioni non stanno qui: vivono nei file lingua sotto
# shop.items.<id>.name e shop.items.<id>.lore.

