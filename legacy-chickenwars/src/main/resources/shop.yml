# Shop di ChickenWars.
#
# categories: ogni categoria occupa uno slot della riga superiore (0-8).
# items: gli slot partono da 18; con slot: -1 vengono assegnati in ordine.
#
# Campi articolo:
#   material     nome Bukkit 1.8 del materiale
#   data         data value (colori lana, vetro, ecc.)
#   amount       quantita' consegnata
#   name         nome italiano; name-en nome inglese
#   lore         descrizione italiana; lore-en descrizione inglese
#   currency     IRON, GOLD, DIAMOND, EMERALD, FEATHER
#   price        costo nella valuta indicata
#   team-color   true = colorato con il colore della squadra
#   enchantments incantesimi applicati
#   effects      effetti pozione, formato TIPO:secondi:livello

