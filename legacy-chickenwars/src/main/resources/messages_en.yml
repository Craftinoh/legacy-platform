prefix: "&6&lCW &8» &r"

help:
  main:
    - ""
    - "&6&l  CHICKEN WARS &8- &7guide"
    - "&8  &m                                        "
    - ""
    - "  &7Every team defends a &e&lRoyal Chicken&7."
    - "  &7While it lives, your team respawns."
    - "  &7Once it dies, every death is final."
    - ""
    - "  &e/cw quickjoin &8» &7jump straight into a match"
    - "  &e/cw leave &8» &7leave the match"
    - "  &e/cw shop &8» &7open the shop"
    - ""
  topics-hint: "  &7More: &f/cw help <topic>&7 — {topics}"
  unknown-topic: "&cUnknown topic &f{topic}&c. Available: &f{topics}"

  game:
    - ""
    - "&6&l  GAME COMMANDS"
    - "&8  &m                                        "
    - ""
    - "  &e/cw quickjoin"
    - "    &7Join the arena closest to starting."
    - ""
    - "  &e/cw join <arena>"
    - "    &7Join a specific arena."
    - "    &8See the list with /cw list"
    - ""
    - "  &e/cw team <team>"
    - "    &7Pick your team before the match starts."
    - "    &8You cannot switch once it begins."
    - ""
    - "  &e/cw shop"
    - "    &7Opens the shop, like the base NPC."
    - ""
    - "  &e/cw leave &8| &e/cw stats &8| &e/cw list"
    - "    &7Leaving, statistics and available arenas."
    - ""

  chicken:
    - ""
    - "&6&l  HOW TO PLAY"
    - "&8  &m                                        "
    - ""
    - "  &e&lTHE ROYAL CHICKEN"
    - "  &7It is alive and has two separate bars:"
    - "  &b&lShield &7always absorbs damage first,"
    - "  &c&lHealth &7is only touched afterwards."
    - "  &7Both regenerate on their own, but only"
    - "  &7after a few seconds without being hit."
    - ""
    - "  &a&lFEEDING IT"
    - "  &7Buy &aHealing Seeds &7from the shop and"
    - "  &7right click &7your own &7chicken: it"
    - "  &7restores health and shield, with a cooldown."
    - ""
    - "  &c&lWHEN IT DIES"
    - "  &7Your team loses respawn: from that moment"
    - "  &7every death is &cfinal&7."
    - "  &7Survivors receive the &e&lLast Feather&7,"
    - "  &7a temporary speed and strength bonus."
    - ""
    - "  &6&lVICTORY"
    - "  &7The last team with a living player wins."
    - ""

  admin:
    - ""
    - "&6&l  ADMINISTRATION"
    - "&8  &m                                        "
    - ""
    - "  &e&lCreate"
    - "  &e/cw admin create <arena> [void|flat|normal]"
    - "    &7Creates arena and world, teleports you"
    - "    &7inside and opens the editor right away."
    - "  &e/cw admin create <arena> here"
    - "    &7Uses the world you are already in."
    - ""
    - "  &e&lConfigure"
    - "  &e/cw admin edit <arena> &8» &7reopen the editor"
    - "  &e/cw admin exit &8» &7close the editor, saving"
    - "  &e/cw admin validate <arena> &8» &7what is missing"
    - "  &e/cw admin save <arena> &8» &7save to file"
    - ""
    - "  &e&lActivate"
    - "  &e/cw admin enable|disable <arena>"
    - "  &e/cw admin start|stop <arena>"
    - ""
    - "  &e&lOther"
    - "  &e/cw admin list|info <arena> &8» &7arena status"
    - "  &e/cw admin tp <arena> &8» &7go to the arena"
    - "  &e/cw admin delete <arena> &8» &7delete it"
    - "  &e/cw admin reload &8» &7reload everything"
    - ""
    - "  &7Details: &f/cw help setup &7and &f/cw help worlds"
    - ""

  setup:
    - ""
    - "&6&l  ARENA EDITOR"
    - "&8  &m                                        "
    - ""
    - "  &7With &f/cw admin edit <arena> &7you get 9"
    - "  &7tools. &e&lEvery action uses the spot you"
    - "  &e&lare standing on&7."
    - ""
    - "  &b1 Compass &8» &7lobby, spectators, corners"
    - "  &d2 Wool &8» &7create and select teams"
    - "  &a3 Bed &8» &7spawn of the selected team"
    - "  &64 Hay &8» &7nest of the selected team"
    - "  &e5 Egg &8» &7where the Royal Chicken spawns"
    - "  &26 Emerald &8» &7where the shopkeeper appears"
    - "  &f7 Iron &8» &7central and team generators"
    - "  &b8 Book &8» &7check what is still missing"
    - "  &a9 Emerald block &8» &7save and exit"
    - ""
    - "  &7Suggested order: compass, then wool to"
    - "  &7create a team, then tools 3-6 inside the"
    - "  &7base, finally iron and book."
    - ""
    - "  &8In the team menu: left click selects,"
    - "  &8right click deletes. Everything saves at once."
    - ""

  worlds:
    - ""
    - "&6&l  WORLD MANAGEMENT"
    - "&8  &m                                        "
    - ""
    - "  &7Each arena has its own world. Arena worlds"
    - "  &7are activated automatically on startup."
    - ""
    - "  &e&lUSING AN EXISTING MAP"
    - "  &e/cw admin create <arena> here"
    - "    &7Uses the world you are standing in,"
    - "    &7without creating any."
    - ""
    - "  &e/cw admin create <arena> <world>"
    - "    &7Uses an existing world by name."
    - ""
    - "  &e/cw admin setworld <arena> [world]"
    - "    &7Changes the world of an existing arena."
    - "    &8Without an argument uses your world."
    - ""
    - "  &8Adopted worlds are never regenerated:"
    - "  &8the plugin loads them exactly as they are."
    - ""
    - "  &e&lWORLD COMMANDS"
    - "  &e/cw admin world list"
    - "    &7Managed worlds, type and state."
    - ""
    - "  &e/cw admin world load <world>"
    - "    &7Activates a world present on disk."
    - ""
    - "  &e/cw admin world unload <world>"
    - "    &7Saves and deactivates the world."
    - ""
    - "  &e/cw admin world tp <world>"
    - "    &7Takes you to the world spawn."
    - ""
    - "  &e&lGENERATION TYPES"
    - "  &fVOID &8» &7empty, for schematic maps"
    - "  &fFLAT &8» &7superflat, for prototypes"
    - "  &fNORMAL &8» &7normal generation"
    - "  &fEXISTING &8» &7adopted world, left untouched"
    - ""
    - "  &8The type is stored in worlds.yml and"
    - "  &8reapplied on every load."
    - ""

