# Upgrade di squadra, trappole e potenziamenti della Gallina Reale.
#
# Ogni costo e' dichiarato per i tre profili economici:
#   solo_duel  usato da DUEL e SOLO
#   doubles    usato da DOUBLES
#   trio       usato da TRIO
#
# I livelli devono formare una sequenza contigua a partire da 1: un buco
# interrompe la lettura e viene segnalato in console.
#
# Campi di un livello:
#   cost            costo per profilo (currency + amount)
#   amplifier       livello effettivo di incantesimo o effetto (0 = primo)
#   value           valore numerico generico (salute, riduzione danno, ...)
#   duration-ticks  durata dell'effetto; 0 = mantenuto dal ciclo di partita

team-upgrades:

  PROTECTION:
    icon: IRON_CHESTPLATE
    slot: 19
    enabled: true
    levels:
      1:
        amplifier: 0
        cost:
          solo_duel: {currency: DIAMOND, amount: 2}
          doubles: {currency: DIAMOND, amount: 2}
          trio: {currency: DIAMOND, amount: 2}
      2:
        amplifier: 1
