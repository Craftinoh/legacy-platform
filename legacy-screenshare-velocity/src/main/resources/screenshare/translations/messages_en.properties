screenshare.command.header=&6LegacyScreenshare &7- staff commands
screenshare.command.start=&e/ss start <player> [report-id] &7- begin a check
screenshare.command.stop=&e/ss stop <player> <outcome> &7- close a check
screenshare.command.cancel=&e/ss cancel <player> <reason> &7- call it off
screenshare.command.status=&e/ss status [player] &7- session details
screenshare.command.list=&e/ss list [page] &7- sessions
screenshare.command.note=&e/ss note <player> <note> &7- add a note

screenshare.error.no-permission=&cYou do not have permission to use this command.
screenshare.error.player-only=&cOnly players can use this command.
screenshare.error.not-found=&cNo session matches that identifier.
