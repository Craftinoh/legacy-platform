name: Build legacy-platform

on:
  push:
    branches:
      - main
      - wip/reports-screenshare-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle

      - name: Prepare wrapper
        run: chmod +x gradlew

      - name: Apply pending hardening migration
        shell: bash
        run: |
          if [[ -f .github/scripts/harden_screenshare.py ]]; then
            python3 .github/scripts/harden_screenshare.py
          fi
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              "legacy-reports-velocity/build.gradle.kts",
              "legacy-screenshare-velocity/build.gradle.kts",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if "java.util.zip.ZipFile(jar)" not in text:
                  continue
              if "import java.util.zip.ZipFile" not in text:
                  text = "import java.util.zip.ZipFile\n" + text
              text = text.replace("java.util.zip.ZipFile(jar)", "ZipFile(jar)")
              path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Check whitespace
        run: git diff --check

      - name: Build reports and screenshare
        run: |
          ./gradlew \
            :legacy-reports-velocity:clean \
            :legacy-reports-velocity:build \
            :legacy-screenshare-velocity:clean \
            :legacy-screenshare-velocity:build \
            --stacktrace

      - name: Re-run focused tests
        run: |
          ./gradlew \
            :legacy-reports-velocity:test \
            :legacy-screenshare-velocity:test \
            --rerun-tasks \
            --stacktrace

      - name: Build all Gradle plugins
        run: ./gradlew buildPlugins --stacktrace

      - name: Verify shaded JDBC service descriptors
        run: python3 .github/scripts/verify_jdbc_services.py

      - name: Commit verified hardening
        if: github.ref == 'refs/heads/wip/reports-screenshare-hardening'
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "Legacy Network CI"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            build.gradle.kts \
            legacy-reports-velocity \
            legacy-screenshare-velocity \
            .github/scripts/harden_screenshare.py
          git diff --cached --check
          git commit -m "fix(screenshare): harden recovery and transfer cleanup"
          git push origin HEAD:wip/reports-screenshare-hardening
