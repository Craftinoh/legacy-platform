name: LegacyMenu
main: it.legacynetwork.menu.LegacyMenuPlugin
version: "${version}"
author: LegacyNetwork
description: Sistema GUI configurabile per backend legacy
softdepend:
  - LanguageBackend
  - PlaceholderAPI
  - LegacyLobby
commands:
  legacymenu:
    description: Comando amministrativo LegacyMenu
    usage: /legacymenu open|reload|list
    aliases: [lmenu, lm]
  lang:
    description: Open the language selection menu
    usage: /lang
  language:
    description: Open the language selection menu
    usage: /language
permissions:
  legacymenu.admin:
    default: op
