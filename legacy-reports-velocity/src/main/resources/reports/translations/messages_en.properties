reports.command.report.usage=&cUsage: &f/report <player> <reason> [details]
reports.command.report.reasons=&7Available reasons: &f{reasons}
reports.command.reports.header=&6LegacyReports &7- staff commands
reports.command.reports.list=&e/reports list [page] &7- open reports
reports.command.reports.info=&e/reports info <id> &7- full report card
reports.command.reports.claim=&e/reports claim <id> &7- take the report
reports.command.reports.investigate=&e/reports investigate <id> &7- start investigating
reports.command.reports.release=&e/reports release <id> &7- give the report back
reports.command.reports.dismiss=&e/reports dismiss <id> <reason> &7- close with no action
reports.command.reports.action=&e/reports action <id> <reason> &7- close after a punishment
reports.command.reports.player=&e/reports player <player> [page] &7- player history
reports.command.reports.notifications=&e/reports notifications &7- toggle your alerts

reports.error.player-only=&cOnly players can use this command.
reports.error.no-permission=&cYou do not have permission to use this command.
reports.error.reasons-unavailable=&cNo report reason is configured right now.
reports.error.invalid-reason=&cUnknown reason. Available: &f{reasons}
reports.error.target-not-found=&c{target} is not connected to the network.
reports.error.target-offline=&c{target} left before the report was saved.
reports.error.self-report=&cYou cannot report yourself.
reports.error.protected-target=&c{target} cannot be reported.
reports.error.details-required=&cThis reason needs a short description.
reports.error.details-too-long=&cKeep the description under {limit} characters.
reports.error.cooldown=&cWait {seconds}s before reporting again.
reports.error.duplicate=&cYou already reported this player: &f#{id}
reports.error.too-many-open=&cYou already have {limit} open reports.
reports.error.invalid-page=&cThat page number is not valid.
reports.error.reason-required=&cWrite the reason for closing the report.
reports.error.not-found=&cNo report matches &f{id}&c.
reports.error.invalid-transition=&cThat report cannot move to this state.
reports.error.already-assigned=&cAnother staff member is handling this report.
reports.error.not-assigned=&cTake the report before closing it.
reports.error.already-resolved=&cThat report is already closed.
reports.error.concurrent-modification=&cSomeone changed the report first. Try again.
reports.error.target-mismatch=&cThat report is about another player.
reports.error.repository-error=&cThe report storage did not answer. Try again.

reports.success.created=&aReport &f#{id} &asent about &f{target}&a.
reports.success.claimed=&aReport &f#{id} &ais yours now.
reports.success.investigating=&aReport &f#{id} &ais under investigation.
reports.success.released=&aReport &f#{id} &ais back in the queue.
reports.success.dismissed=&aReport &f#{id} &aclosed with no action.
reports.success.action-taken=&aReport &f#{id} &aclosed after a punishment.
reports.success.screenshare-started=&aReport &f#{id} &amoved to screenshare.
reports.success.screenshare-ended=&aReport &f#{id} &ais back under investigation.
reports.success.note-added=&aNote added to report &f#{id}&a.
reports.success.success=&aDone.
reports.success.unchanged=&7Nothing to change.
reports.success.notifications-on=&aReport alerts enabled.
reports.success.notifications-off=&7Report alerts disabled.

