# Λίστα καθολικών ετικετών:
# %nl% - Αλλάζει γραμμή.
# %username% - Αντικαθιστά το όνομα χρήστη του παίκτη που λαμβάνει το μήνυμα.
# %displayname% - Αντικαθιστά το ψευδώνυμο (και τα χρώματα) του παίκτη που λαμβάνει το μήνυμα.

# Εγγραφή
registration:
    register_request: '&3Παρακαλώ, κάνε εγγραφή στον διακομιστή με την εντολή: /register <κωδικός> <επιβεβαίωσηΚωδικού>'
    command_usage: '&cΧρήση: /register <κωδικός> <επιβεβαίωσηΚωδικού>'
    reg_only: '&4Μόνο εγγεγραμμένοι χρήστες μπορούν να συνδεθούν! Επισκέψου το http://example.com για να κάνεις εγγραφή!'
    kicked_admin_registered: 'Ένας διαχειριστής μόλις σε ενέγραψε· παρακαλώ συνδέσου ξανά.'
    success: '&2Η εγγραφή ολοκληρώθηκε με επιτυχία!'
    disabled: '&cΗ εγγραφή μέσα από το παιχνίδι είναι απενεργοποιημένη!'
    name_taken: '&cΑυτό το όνομα χρήστη είναι ήδη εγγεγραμμένο!'

# Σφάλματα κωδικού κατά την εγγραφή
password:
    match_error: '&cΟι κωδικοί δεν ταιριάζουν, έλεγξέ τους ξανά!'
    name_in_password: '&cΔεν μπορείς να χρησιμοποιήσεις το όνομά σου ως κωδικό, διάλεξε άλλον...'
    unsafe_password: '&cΟ κωδικός που επέλεξες δεν είναι ασφαλής, διάλεξε άλλον...'
    forbidden_characters: '&4Ο κωδικός σου περιέχει μη επιτρεπτούς χαρακτήρες. Επιτρεπτοί χαρακτήρες: %valid_chars'
    wrong_length: '&cΟ κωδικός σου είναι πολύ μικρός ή πολύ μεγάλος! Δοκίμασε έναν άλλον!'

# Σύνδεση
login:
    command_usage: '&cΧρήση: /login <κωδικός>'
    wrong_password: '&cΛάθος κωδικός!'
    success: '&2Επιτυχής σύνδεση!'
    login_request: '&cΠαρακαλώ, συνδέσου με την εντολή: /login <κωδικός>'
    timeout_error: '&4Ο χρόνος σύνδεσης έληξε, αποβλήθηκες από τον διακομιστή, δοκίμασε ξανά!'

# Σφάλματα
error:
    unregistered_user: '&cΑυτός ο χρήστης δεν είναι εγγεγραμμένος!'
    denied_command: '&cΓια να χρησιμοποιήσεις αυτή την εντολή πρέπει να έχεις συνδεθεί!'
    denied_chat: '&cΓια να συνομιλήσεις πρέπει να έχεις συνδεθεί!'
    not_logged_in: '&cΔεν έχεις συνδεθεί!'
    tempban_max_logins: '&cΑποκλείστηκες προσωρινά επειδή απέτυχες να συνδεθείς πάρα πολλές φορές.'
    max_registration: '&cΞεπέρασες τον μέγιστο αριθμό εγγραφών (%reg_count/%max_acc %reg_names) για τη σύνδεσή σου!'
    no_permission: '&4Δεν έχεις δικαίωμα να εκτελέσεις αυτή την ενέργεια!'
    unexpected_error: '&4Παρουσιάστηκε απροσδόκητο σφάλμα, επικοινώνησε με έναν διαχειριστή!'
    kick_for_vip: '&3Ένας παίκτης VIP συνδέθηκε ενώ ο διακομιστής ήταν γεμάτος!'
    logged_in: '&cΕίσαι ήδη συνδεδεμένος!'
    kick_unresolved_hostname: '&cΠαρουσιάστηκε σφάλμα: δεν ήταν δυνατή η επίλυση του ονόματος υπολογιστή του παίκτη!'

# AntiBot
antibot:
    kick_antibot: 'Η προστασία AntiBot είναι ενεργή! Πρέπει να περιμένεις μερικά λεπτά πριν συνδεθείς στον διακομιστή.'
