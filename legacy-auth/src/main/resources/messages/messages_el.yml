    auto_disabled: '&2[AntiBotService] Το AntiBot απενεργοποιήθηκε μετά από %m λεπτά!'

unregister:
    success: '&cΗ διαγραφή της εγγραφής ολοκληρώθηκε με επιτυχία!'
    command_usage: '&cΧρήση: /unregister <κωδικός>'

