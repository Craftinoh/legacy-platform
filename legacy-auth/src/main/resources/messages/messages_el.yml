    command_usage: '&cΧρήση: /email recovery <Email>'
    email_sent: '&2Το email ανάκτησης στάλθηκε με επιτυχία! Έλεγξε τα εισερχόμενά σου!'
    code:
        code_sent: 'Ένας κωδικός ανάκτησης για την επαναφορά του κωδικού σου στάλθηκε στο email σου.'
        incorrect: 'Ο κωδικός ανάκτησης δεν είναι σωστός! Σου απομένουν %count προσπάθειες.'
        tries_exceeded: 'Ξεπέρασες τον μέγιστο αριθμό προσπαθειών εισαγωγής του κωδικού ανάκτησης. Χρησιμοποίησε "/email recovery [email]" για να δημιουργήσεις νέον.'
        correct: 'Ο κωδικός ανάκτησης καταχωρήθηκε σωστά!'
