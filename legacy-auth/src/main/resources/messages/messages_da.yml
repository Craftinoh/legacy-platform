# Liste over globale tags:
# %nl% - Skifter til ny linje.
# %username% - Erstattes med brugernavnet på den spiller, der modtager beskeden.
# %displayname% - Erstattes med kaldenavnet (og farverne) på den spiller, der modtager beskeden.

