# Lista över globala taggar:
# %nl% - Byter till ny rad.
# %username% - Ersätts med användarnamnet på spelaren som tar emot meddelandet.
# %displayname% - Ersätts med smeknamnet (och färgerna) på spelaren som tar emot meddelandet.

# Registrering
registration:
