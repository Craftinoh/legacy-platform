    reg_only: '&4Endast registrerade användare kan ansluta till servern! Besök http://example.com för att registrera dig!'
    kicked_admin_registered: 'En administratör har just registrerat dig; logga in igen.'
    success: '&2Registreringen lyckades!'
    disabled: '&cRegistrering i spelet är avstängd!'
    name_taken: '&cDu har redan registrerat det här användarnamnet!'

# Lösenordsfel vid registrering
password:
